<div id="m-connect-mock" aria-label="M-Connect chat interface preview">
  <style>
    #m-connect-mock{--ink:light-dark(#15221c,#edf4ee);--muted:light-dark(#66756d,#9ba9a0);--surface:light-dark(#f7faf7,#111a16);--side:light-dark(#eaf1eb,#18241e);--line:light-dark(#cddbd0,#34473c);--bubble:light-dark(#e3ece5,#26372e);--accent:light-dark(#5b7e20,#d5fa7a);--accent-ink:light-dark(#fff,#192516);--danger:light-dark(#b84242,#e27979);font:14px/1.4 Manrope,system-ui,sans-serif;color:var(--ink)}
    #m-connect-mock *{box-sizing:border-box}#m-connect-mock .app{display:grid;grid-template-columns:218px 1fr;min-height:490px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}#m-connect-mock .side{background:var(--side);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:14px}#m-connect-mock .brand{font-weight:700;letter-spacing:1.2px;font-size:15px;padding:0 6px}#m-connect-mock .new{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px;text-align:left;font:600 12px inherit}#m-connect-mock .search{padding:9px;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:12px}#m-connect-mock .label{font-size:10px;letter-spacing:1px;color:var(--muted);padding:0 6px}.conversation{display:flex;gap:9px;align-items:center;padding:9px 7px;border-radius:8px}.conversation.active{background:light-dark(#dce9de,#2b3b31)}.avatar{width:32px;height:32px;border-radius:10px;background:#f0c665;color:#25311f;display:grid;place-items:center;font-weight:700}.conversation b,.conversation small{display:block}.conversation small{color:var(--muted);font-size:11px}.profile{margin-top:auto;border-top:1px solid var(--line);padding:13px 5px 0;display:flex;gap:8px;align-items:center;font-size:12px}.profile .avatar{width:28px;height:28px;border-radius:50%;background:#bde381}.chat{display:grid;grid-template-rows:70px 1fr auto}.head{display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--line);gap:10px}.head .person{margin-right:auto}.person b,.person small{display:block}.person small{font-size:11px;color:var(--muted)}.actions,.composer{display:flex;gap:7px;align-items:center}.icon-btn,.tool{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;min-height:34px;padding:0 10px;font:600 12px inherit}.icon-btn svg,.tool svg{width:16px;height:16px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.messages{padding:22px min(7vw,52px);display:flex;flex-direction:column;gap:14px}.day{align-self:center;color:var(--muted);font-size:10px;letter-spacing:1px}.msg{max-width:70%;padding:10px 12px;border-radius:12px 12px 12px 3px;background:var(--bubble);font-size:13px}.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-radius:12px 12px 3px 12px}.msg small{display:block;margin-top:4px;font-size:10px;opacity:.68}.composer{margin:0 20px 20px;padding:7px 8px;border:1px solid var(--line);border-radius:12px}.composer input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:13px inherit;outline:0}.tool{display:flex;align-items:center;gap:4px}.send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;min-width:36px;height:34px}.call{position:absolute;right:18px;top:86px;width:205px;aspect-ratio:16/11;background:#09100c;color:#e8f0e9;border:1px solid #445449;border-radius:12px;overflow:hidden;display:none;padding:12px}.call.show{display:flex;flex-direction:column;justify-content:space-between}.call .remote{font-size:12px;opacity:.85}.call .local{align-self:flex-end;background:#28392f;border:1px solid #657567;border-radius:7px;padding:8px;font-size:10px}.call .controls{display:flex;justify-content:center;gap:7px}.call .controls button{border:0;background:#314138;color:#fff;border-radius:50%;width:32px;height:32px}.call .controls button:last-child{background:var(--danger)}.shell{position:relative}@media(max-width:560px){#m-connect-mock .app{grid-template-columns:1fr}#m-connect-mock .side{display:none}#m-connect-mock .messages{padding:18px}.tool span{display:none}.tool{padding:0 8px}.call{right:12px;top:78px}}
  </style>
  <div class="shell"><div class="app">
    <aside class="side"><div class="brand">✦ M-CONNECT</div><button class="new" type="button">＋ New conversation</button><div class="search">⌕ Search conversations</div><div class="label">CONVERSATIONS</div><div class="conversation active"><div class="avatar">A</div><div><b>Arjun Mehta</b><small>Online now</small></div></div><div class="conversation"><div class="avatar" style="background:#cbb7fa">D</div><div><b>Design Studio</b><small>Maya shared a file</small></div></div><div class="profile"><div class="avatar">M</div><div><b>Manjunath</b><br><small>Available</small></div></div></aside>
    <section class="chat"><header class="head"><div class="avatar">A</div><div class="person"><b>Arjun Mehta</b><small>● Online now</small></div><div class="actions"><button class="icon-btn" type="button" data-tooltip="Camera preview" aria-label="Camera preview">◉</button><button class="icon-btn" id="video-call" type="button" data-tooltip="Start video call" aria-label="Start video call"><svg viewBox="0 0 24 24"><path d="M3 7.8A2.8 2.8 0 0 1 5.8 5h7.4A2.8 2.8 0 0 1 16 7.8v8.4a2.8 2.8 0 0 1-2.8 2.8H5.8A2.8 2.8 0 0 1 3 16.2z"/><path d="m16 10 4.4-2.5a.4.4 0 0 1 .6.35v8.3a.4.4 0 0 1-.6.35L16 14z"/></svg></button></div></header><div class="messages"><div class="day">TODAY</div><div class="msg">Could you share the final project brief?<small>10:31</small></div><div class="msg me">Sure — I’ll send it now.<small>10:34 ✓✓</small></div></div><form class="composer" id="demo-composer"><button class="tool" id="upload" type="button"><span>⇧</span><span>Upload</span></button><button class="tool" id="voice" type="button"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg><span>Voice</span></button><input aria-label="Message" placeholder="Write a message…"><button class="send" aria-label="Send message">↑</button></form></section>
  </div><section class="call" id="call-preview" aria-live="polite"><div class="remote">Arjun’s video</div><div class="local">Your camera</div><div class="controls"><button type="button">▣</button><button type="button">♩</button><button id="end-call" type="button" aria-label="End call">☎</button></div></section></div>
  <script>
    const root=document.getElementById('m-connect-mock'),upload=root.querySelector('#upload'),voice=root.querySelector('#voice'),call=root.querySelector('#call-preview');
    upload.addEventListener('click',()=>{upload.lastElementChild.textContent=upload.lastElementChild.textContent==='Upload'?'brief.pdf':'Upload'});
    voice.addEventListener('click',()=>{const active=voice.getAttribute('aria-pressed')==='true';voice.setAttribute('aria-pressed',String(!active));voice.lastElementChild.textContent=active?'Voice':'Recording…'});
    root.querySelector('#video-call').addEventListener('click',()=>call.classList.add('show'));root.querySelector('#end-call').addEventListener('click',()=>call.classList.remove('show'));
  </script>
</div>
